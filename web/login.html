<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 喜宝IPTV</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1115; --bg2: #1a1d24; --card: #1f232c; --border: #2a2f3a;
  --text: #e6e8eb; --text2: #9aa0ab; --accent: #ff6b35; --accent2: #4f8cff;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  background: radial-gradient(ellipse at top, #1a1d24 0%, #0f1115 60%);
}
.login-wrap { width: 100%; max-width: 380px; }
.logo { text-align: center; margin-bottom: 24px; }
.logo h1 { font-size: 30px; font-weight: 700; }
.logo h1 span { color: var(--accent); }
.logo p { color: var(--text2); font-size: 13px; margin-top: 4px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 32px 28px;
}
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text); font-size: 15px; outline: none;
}
.field input:focus { border-color: var(--accent); }
.btn {
  width: 100%; padding: 13px; border: none; border-radius: 10px; cursor: pointer;
  background: var(--accent); color: #fff; font-size: 15px; font-weight: 600; margin-top: 4px;
  transition: opacity .15s;
}
.btn:hover { opacity: .88; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.err { color: #ff5555; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
.foot { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text2); }
.foot a { color: var(--accent2); text-decoration: none; }
.hint-box {
  margin-top: 16px; padding: 12px; background: var(--bg2); border-radius: 8px;
  font-size: 12px; color: var(--text2); line-height: 1.7;
}
.hint-box b { color: var(--accent); }
</style>
</head>
<body>
<div id="app">
  <div class="login-wrap">
    <div class="logo">
      <h1>📺 喜宝<span>IPTV</span></h1>
      <p>自建 IPTV 管理门户</p>
    </div>
    <div class="card">
      <div class="field">
        <label>用户名</label>
        <input v-model="username" type="text" placeholder="cjc" @keydown.enter="login">
      </div>
      <div class="field">
        <label>密码</label>
        <input v-model="password" type="password" placeholder="请输入密码" @keydown.enter="login">
      </div>
      <button class="btn" @click="login" :disabled="loading">
        {{ loading ? '登录中...' : '进入后台' }}
      </button>
      <div class="err">{{ error }}</div>
    </div>
    <div class="foot">
      <a href="/">← 返回首页下载 APK</a>
    </div>
    <div class="hint-box">
      首次登录请及时修改密码
    </div>
  </div>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return { username: '', password: '', loading: false, error: '' };
  },
  methods: {
    async login() {
      if (!this.username || !this.password) {
        this.error = '请输入用户名和密码';
        return;
      }
      this.loading = true;
      this.error = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: this.username, password: this.password }),
        });
        const json = await res.json();
        if (json.code !== 0) {
          this.error = json.msg || '登录失败';
          return;
        }
        // 登录成功，token 已在 cookie，跳转后台
        window.location.href = '/admin';
      } catch (e) {
        this.error = '网络错误: ' + e.message;
      } finally {
        this.loading = false;
      }
    },
  },
}).mount('#app');
</script>
</body>
</html>
