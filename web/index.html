<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喜宝IPTV</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1115; --bg2: #1a1d24; --card: #1f232c; --border: #2a2f3a;
  --text: #e6e8eb; --text2: #9aa0ab; --accent: #ff6b35; --accent2: #4f8cff; --green: #2ecc71;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  background: radial-gradient(ellipse at top, #1a1d24 0%, #0f1115 60%);
}
.nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: rgba(15,17,21,0.9); backdrop-filter: blur(8px); z-index: 10;
}
.nav .brand { font-size: 18px; font-weight: 700; }
.nav .brand span { color: var(--accent); }
.nav .links { display: flex; gap: 16px; align-items: center; }
.nav .links a {
  color: var(--text2); text-decoration: none; font-size: 14px;
  padding: 7px 14px; border-radius: 8px; transition: all .15s;
}
.nav .links a:hover { color: var(--text); background: var(--card); }
.nav .links a.admin { background: var(--accent); color: #fff; font-weight: 600; }
.hero { text-align: center; padding: 60px 24px 40px; }
.hero h1 { font-size: 40px; font-weight: 700; margin-bottom: 8px; }
.hero h1 span { color: var(--accent); }
.hero p { color: var(--text2); font-size: 16px; margin-bottom: 32px; }
.download-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 20px;
  max-width: 520px; margin: 0 auto; padding: 40px 32px;
}
.dl-btn {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  padding: 18px; background: var(--accent); color: #fff; border-radius: 14px;
  font-size: 18px; font-weight: 700; text-decoration: none; margin-bottom: 24px;
  transition: opacity .15s;
}
.dl-btn:hover { opacity: .88; }
.qr { display: flex; align-items: center; gap: 24px; justify-content: center; margin-bottom: 20px; }
.qr .qrcode { width: 140px; height: 140px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.qr .qrcode img { width: 130px; height: 130px; }
.steps { text-align: left; font-size: 14px; color: var(--text2); line-height: 2; }
.steps b { color: var(--text); }
.steps .num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff;
  font-size: 12px; margin-right: 8px;
}
.features {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px; max-width: 900px; margin: 48px auto 40px; padding: 0 24px;
}
.feat {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px;
}
.feat .ico { font-size: 28px; margin-bottom: 10px; }
.feat h3 { font-size: 16px; margin-bottom: 6px; }
.feat p { font-size: 13px; color: var(--text2); line-height: 1.6; }
.footer { text-align: center; padding: 24px; color: var(--text2); font-size: 12px; border-top: 1px solid var(--border); }
.footer a { color: var(--accent2); text-decoration: none; }
</style>
</head>
<body>
<div id="app">
  <div class="nav">
    <div class="brand">📺 喜宝<span>IPTV</span></div>
    <div class="links">
      <a href="#download">下载 APK</a>
      <a href="#features">功能</a>
      <a href="/admin" class="admin">管理后台</a>
    </div>
  </div>

  <div class="hero" id="download">
    <h1>📺 喜宝<span>IPTV</span></h1>
    <p>自建 IPTV 播放器 · 手机 / 电视 / 盒子通用</p>
    <div class="download-card">
      <a class="dl-btn" :href="apkUrl" download>⬇️ 下载 APK</a>
      <div class="steps">
        <div><span class="num">1</span>下载并安装 <b>{{ apkName }}</b></div>
        <div><span class="num">2</span>打开 APP，输入后端地址</div>
        <div><span class="num">3</span>选择频道，开始观看</div>
      </div>
    </div>
  </div>

  <div class="features" id="features">
    <div class="feat"><div class="ico">📡</div><h3>多源导入</h3><p>粘贴任意 M3U 直播源，一键拉取合并去重</p></div>
    <div class="feat"><div class="ico">🗂️</div><h3>频道管理</h3><p>分组、台标、启停、排序，全在网页后台</p></div>
    <div class="feat"><div class="ico">📺</div><h3>EPG 节目单</h3><p>支持 XMLTV 源，自动匹配频道显示节目预告</p></div>
    <div class="feat"><div class="ico">🔒</div><h3>完全自建</h3><p>数据在你自己服务器，不依赖第三方</p></div>
  </div>

  <div class="footer">
    © <span id="year"></span> {{ siteName }} · <a href="/admin">管理后台</a>
  </div>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return { siteName: '喜宝IPTV', apkUrl: '', apkName: '喜宝IPTV.apk' };
  },
  async mounted() {
    document.getElementById('year').textContent = new Date().getFullYear();
    try {
      const res = await fetch('/api/settings');
      const json = await res.json();
      if (json.code === 0 && json.data) {
        this.siteName = json.data.site_name || '喜宝IPTV';
        if (json.data.apk_url) {
          this.apkUrl = json.data.apk_url;
          this.apkName = json.data.apk_url.split('/').pop();
        }
      }
    } catch (e) {}
    // 默认 APK 地址（GitHub Release 直链）
    if (!this.apkUrl) {
      this.apkUrl = 'https://github.com/billconan2017/xibao-iptv/releases/latest/download/xibao-iptv-v1.0.1.apk';
      this.apkName = '喜宝IPTV.apk';
    }
  },
}).mount('#app');
</script>
</body>
</html>
