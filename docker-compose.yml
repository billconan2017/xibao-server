# 喜宝IPTV - 完整门户部署
# 综合管理后台：频道管理 / 多源导入 / EPG / 点播 / 套餐 / 设备授权 / APK下载首页
services:
  xibao-server:
    build: .
    image: billcoann/xibao-server:latest
    container_name: xibao-server
    restart: unless-stopped
    ports:
      - "8089:8080"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai