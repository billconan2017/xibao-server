name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test family access, EPG and playlists
        run: |
          docker run --rm -v "$PWD:/app" -w /app node:22-alpine sh -c "npm ci && node --test test/*.test.js"
      - name: Read package version
        id: version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid package version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${version}\n`);
          NODE
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          username: billcoann
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            billcoann/xibao-server:${{ steps.version.outputs.value }}
            billcoann/xibao-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/billconan2017/xibao-server
            org.opencontainers.image.revision=${{ github.sha }}
